[package]
name = "tread"
version = "0.1.0"
edition = "2024"

[lib]
name = "tread"
path = "src/lib.rs"

[[bin]]
name = "tread"
path = "src/main.rs"

[dependencies]
doc-model = { path = "../doc-model" }
arxiv-render = { path = "../arxiv-render" }
kitty-graphics = { path = "../kitty-graphics" }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ui-theme = { path = "../ui-theme" }
# Markdown ingestion (B1).  Same crate trench already uses elsewhere,
# so workspace dep resolution stays unified.
pulldown-cmark = "0.12"
# PDF ingestion (B2).  Same crate cli-pdf-to-text wraps; we call it
# via bytes (not a path) so hosts can pass in-memory buffers from
# their HTTP layer without temp-file dancing.
pdf-extract = "0.7"
# EPUB ingestion (B3).  Same crates cli-epub-to-text wraps.
# `epub` parses spine + resources; `html2text` converts each chapter's
# XHTML body to plain text.  Feed the bytes through Cursor for the
# in-memory entry point.
epub = "2.1"
html2text = "0.15"
# HTML ingestion (B4).  scraper wraps html5ever — robust standard
# parser used across the Rust ecosystem.  We walk the resulting DOM
# and emit tread blocks (Header / StyledLine / ListItem / CodeBlock
# / Quote / Rule) so HTML content renders structured rather than
# flattened to plain text.
scraper = "0.20"
ego-tree = "0.6"
# Voice / TTS subsystem.
rodio = "0.19"
ureq = { version = "2.12", features = ["json"] }

[package]
name = "tread"
version = "0.1.0"
edition = "2024"

[lib]
name = "tread"
path = "src/lib.rs"

[[bin]]
name = "tread"
path = "src/main.rs"

[dependencies]
doc-model = { path = "../doc-model" }
arxiv-render = { path = "../arxiv-render" }
kitty-graphics = { path = "../kitty-graphics" }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ui-theme = { path = "../ui-theme" }
# Markdown ingestion (B1).  Same crate trench already uses elsewhere,
# so workspace dep resolution stays unified.
pulldown-cmark = "0.12"
# Voice / TTS subsystem.
rodio = "0.19"
ureq = { version = "2.12", features = ["json"] }

[package]
name = "tread"
version = "0.1.0"
edition = "2024"

[lib]
name = "tread"
path = "src/lib.rs"

[[bin]]
name = "tread"
path = "src/main.rs"

[features]
# Voice playback via rodio (cpal + symphonia + lewton + ...).
# Default-on: standalone tread CLI users and trench both pick it up
# automatically.  Opt out with `default-features = false` (or
# `--no-default-features`) when the audio stack isn't wanted — saves
# ~500 KB-1 MB of binary by dropping rodio's decoder pyramid.
default = ["voice"]
voice = ["dep:rodio"]

[dependencies]
doc-model = { path = "../doc-model" }
arxiv-render = { path = "../arxiv-render" }
kitty-graphics = { path = "../kitty-graphics" }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ui-theme = { path = "../ui-theme" }
# Markdown ingestion (B1).  Same crate trench already uses elsewhere,
# so workspace dep resolution stays unified.
pulldown-cmark = "0.12"
# PDF ingestion (B2).  Same crate cli-pdf-to-text wraps; we call it
# via bytes (not a path) so hosts can pass in-memory buffers from
# their HTTP layer without temp-file dancing.
pdf-extract = "0.7"
# EPUB ingestion (B3).  `epub` parses the spine + resources from
# in-memory bytes via Cursor; chapter XHTML then walks through
# tread's own html module (#42) for the same structured rendering
# as standalone HTML — replaces the old `html2text` 110-col flatten.
epub = "2.1"
# HTML ingestion (B4).  scraper wraps html5ever — robust standard
# parser used across the Rust ecosystem.  We walk the resulting DOM
# and emit tread blocks (Header / StyledLine / ListItem / CodeBlock
# / Quote / Rule) so HTML content renders structured rather than
# flattened to plain text.
scraper = "0.20"
ego-tree = "0.6"
# Voice / TTS subsystem.  Gated by the `voice` feature so non-voice
# builds can shed rodio + cpal + symphonia (~500 KB-1 MB).
rodio = { version = "0.19", optional = true }
# HTTP for fetch_any (auto-format URL fetch) and ElevenLabs voice
# synthesis.  Sharing reqwest with arxiv-render lets cargo dedupe the
# HTTP/TLS stack into a single copy (~150 KiB binary) instead of
# linking both reqwest and ureq.  Features kept narrow: blocking is
# all the call sites need; `json` enables RequestBuilder::json for
# the ElevenLabs request body.
reqwest = { version = "0.12", features = ["blocking", "json"] }
# JPEG decode → PNG re-encode for the Kitty image loader. Default
# features disabled: we only need jpeg + png codecs. Memory cost is
# bounded by the largest figure in the visible window; bytes are
# cached in ImageState per-session, no on-disk cache yet.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
